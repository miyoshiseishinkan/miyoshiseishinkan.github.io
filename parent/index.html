<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="成進館">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>成進館</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; color: #1c1c1e; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #fff; }
    /* 画面の端の安全な余白（ホームバーなど）を測るための見えない箱 */
    #probe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

    /* 起動画面：白い画面の中央にアイコンが浮かび上がる */
    #splash { position: fixed; inset: 0; z-index: 10; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.45s ease, visibility 0.45s; }
    #splash img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 12px 34px rgba(0, 0, 0, 0.13); animation: pop 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    #splash .dots { margin-top: 34px; display: flex; gap: 8px; opacity: 0; animation: fadein 0.4s 1.2s forwards; }
    #splash .dots i { width: 7px; height: 7px; border-radius: 50%; background: #29a9e6; animation: blink 1.1s infinite ease-in-out; }
    #splash .dots i:nth-child(2) { animation-delay: 0.18s; }
    #splash .dots i:nth-child(3) { animation-delay: 0.36s; }
    #splash.hide { opacity: 0; visibility: hidden; }
    #splash.hide img { transform: scale(1.06); transition: transform 0.45s ease; }
    @keyframes pop { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadein { to { opacity: 1; } }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }

    /* 通知のお願い（下から出るシート） */
    #pushBack { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.28); opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s; }
    #pushSheet { position: fixed; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); z-index: 21; max-width: 520px; margin: 0 auto; background: rgba(255, 255, 255, 0.96); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 28px; padding: 26px 22px 18px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2); text-align: center; transform: translateY(120%); transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1); }
    body.push-open #pushBack { opacity: 1; visibility: visible; }
    body.push-open #pushSheet { transform: translateY(0); }
    #pushSheet img { width: 64px; height: 64px; border-radius: 15px; }
    #pushSheet h2 { font-size: 20px; margin: 14px 0 8px; }
    #pushSheet p { font-size: 15px; line-height: 1.6; color: #555; margin: 0 0 18px; }
    #pushSheet button { display: block; width: 100%; height: 50px; border: 0; border-radius: 25px; font-size: 17px; font-weight: 600; font-family: inherit; }
    #pushYes { background: #29a9e6; color: #fff; margin-bottom: 8px; }
    #pushNo { background: transparent; color: #007aff; }
    #toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); z-index: 30; transform: translate(-50%, -150%); background: rgba(30, 30, 30, 0.88); color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 14px; transition: transform 0.35s; }
    #toast.show { transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div id="probe"></div>
  <iframe id="app" title="成進館" allow="clipboard-write"></iframe>
  <div id="splash"><img src="icon-512.png" alt=""><div class="dots"><i></i><i></i><i></i></div></div>
  <div id="pushBack"></div>
  <div id="pushSheet">
    <img src="icon-192.png" alt="">
    <h2 id="pushTitle">通知を受け取りますか？</h2>
    <p id="pushText">塾からのお知らせや、成績の登録、特別講習の申込の受付を通知でお知らせします。</p>
    <button id="pushYes">通知を受け取る</button>
    <button id="pushNo">あとで</button>
  </div>
  <div id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
  <script>
    // ==================================================
    // 成進館 入口ページ（parent）
    //   ・アプリ本体（Google Apps Script）をこのページの中に表示する
    //   ・ログイン情報をこのページに保存して、次に開いたときもログインしたままにする
    //   ・起動画面、通知の受け取り、アプリアイコンの数字
    // ==================================================
    const CONF = {
      app: 'parent',
      gas: 'https://script.google.com/macros/s/AKfycbzrAcplrteOixOiznXT0kquwavk3_1ufs3qo2mamhCE56U9fHa7rJzf-fUUFCA6h1yiyg/exec',
      vapidKey: 'BOkFvKoOoKLrNRPoBRR-MyKo2ONrGPoeDPv-C9oE9VQTwaVbipY_IIR0Ryzb4RhRfc00lo8pP-a6_-WIo8AldjE',
      firebase: {
        apiKey: 'AIzaSyAXgatpK7WdHkONm8klIzUyQPUNny0NaD4',
        authDomain: 'seishinkan-app-9bdb9.firebaseapp.com',
        projectId: 'seishinkan-app-9bdb9',
        storageBucket: 'seishinkan-app-9bdb9.firebasestorage.app',
        messagingSenderId: '1024665131555',
        appId: '1:1024665131555:web:0c5b3f9cade9954865ef96'
      }
    };
    // アプリ本体（Googleのサーバー）から届く合図だけを受け付ける
    const ALLOWED = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
    const STORE_KEY = 'seishin_store_' + CONF.app;
    const ASKED_KEY = 'seishin_push_asked_' + CONF.app;
    const $ = (id) => document.getElementById(id);

    let store = {};
    try { store = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { store = {}; }
    function saveStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }
    // 保存したログイン情報が端末の都合で消されないようにお願いする
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

    let pendingOpen = new URLSearchParams(location.search).get('open') || '';
    if (pendingOpen) history.replaceState(null, '', location.pathname);
    let inner = null, innerOrigin = '';
    function toInner(msg) {
      if (!inner) return;
      msg.ns = 'seishin';
      try { inner.postMessage(msg, innerOrigin); } catch (e) {}
    }
    function insets() {
      const cs = getComputedStyle($('probe'));
      return { top: parseFloat(cs.paddingTop) || 0, bottom: parseFloat(cs.paddingBottom) || 0 };
    }
    function toast(t) {
      const el = $('toast');
      el.textContent = t;
      el.classList.add('show');
      clearTimeout(toast.t);
      toast.t = setTimeout(() => el.classList.remove('show'), 2600);
    }

    // ---- 起動画面 ----
    let splashDone = false;
    function hideSplash() {
      if (splashDone) return;
      splashDone = true;
      $('splash').classList.add('hide');
    }
    setTimeout(hideSplash, 15000);
    $('app').addEventListener('load', () => { setTimeout(() => { if (!inner) hideSplash(); }, 5000); });
    $('app').src = CONF.gas;

    // ---- アプリ本体とのやりとり ----
    window.addEventListener('message', (e) => {
      if (!ALLOWED.test(e.origin) || !e.data || e.data.ns !== 'seishin') return;
      inner = e.source;
      innerOrigin = e.origin;
      const d = e.data;
      if (d.type === 'hello') {
        toInner({ type: 'store', data: store, open: pendingOpen, insets: insets(), push: pushState() });
        pendingOpen = '';
        if (pushState() === 'granted') refreshToken();
      } else if (d.type === 'set') {
        if (typeof d.key === 'string' && typeof d.value === 'string' && d.value.length < 200000) { store[d.key] = d.value; saveStore(); }
      } else if (d.type === 'remove') {
        if (typeof d.key === 'string') { delete store[d.key]; saveStore(); }
      } else if (d.type === 'ready') {
        hideSplash();
        if (d.loggedIn) setTimeout(maybeAskPush, 1500);
      } else if (d.type === 'badge') {
        setBadge(d.count);
      } else if (d.type === 'push-open') {
        openPushSheet(true);
      }
    });
    window.addEventListener('resize', () => toInner({ type: 'insets', insets: insets() }));

    // ---- アプリアイコンの数字 ----
    function setBadge(n) {
      n = Math.max(0, parseInt(n, 10) || 0);
      try {
        if ('setAppBadge' in navigator) { if (n > 0) navigator.setAppBadge(n); else navigator.clearAppBadge(); }
      } catch (e) {}
      if (swReg && swReg.active) swReg.active.postMessage({ type: 'badge', count: n });
    }

    // ---- 通知 ----
    let swReg = null, messaging = null;
    const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    function pushState() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return isIOS && !standalone ? 'need-install' : 'unsupported';
      if (isIOS && !standalone) return 'need-install';
      return Notification.permission; // default / granted / denied
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then((reg) => { swReg = reg; }).catch(() => {});
      navigator.serviceWorker.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'open') toInner({ type: 'open', target: e.data.target || '' });
      });
    }
    function getMessaging() {
      if (messaging) return messaging;
      if (!window.firebase) return null;
      if (!firebase.apps.length) firebase.initializeApp(CONF.firebase);
      messaging = firebase.messaging();
      return messaging;
    }
    function refreshToken() {
      const m = getMessaging();
      if (!m) return Promise.resolve('');
      return navigator.serviceWorker.ready.then((reg) => {
        swReg = reg;
        return m.getToken({ vapidKey: CONF.vapidKey, serviceWorkerRegistration: reg });
      }).then((token) => {
        if (token) toInner({ type: 'push-token', token: token });
        return token;
      }).catch(() => '');
    }
    function maybeAskPush() {
      if (pushState() !== 'default') return;
      try { if (localStorage.getItem(ASKED_KEY)) return; localStorage.setItem(ASKED_KEY, '1'); } catch (e) {}
      openPushSheet(false);
    }
    function openPushSheet() {
      const st = pushState();
      const yes = $('pushYes'), no = $('pushNo');
      yes.style.display = '';
      no.textContent = 'あとで';
      if (st === 'need-install') {
        $('pushTitle').textContent = 'ホーム画面に追加してください';
        $('pushText').innerHTML = '通知は、このページをホーム画面に追加して開いたときに受け取れます。<br>Safariの共有ボタン →「ホーム画面に追加」で追加できます。';
        yes.style.display = 'none'; no.textContent = '閉じる';
      } else if (st === 'unsupported') {
        $('pushTitle').textContent = '通知を使えません';
        $('pushText').textContent = 'この端末・ブラウザは通知に対応していません。iPhoneはiOS 16.4以降で、ホーム画面に追加して開いてください。';
        yes.style.display = 'none'; no.textContent = '閉じる';
      } else if (st === 'denied') {
        $('pushTitle').textContent = '通知がオフになっています';
        $('pushText').innerHTML = '端末の設定で通知が止められています。<br>iPhoneは「設定 → 通知 → 成進館」から「通知を許可」をオンにしてください。';
        yes.style.display = 'none'; no.textContent = '閉じる';
      } else if (st === 'granted') {
        $('pushTitle').textContent = '通知はオンになっています';
        $('pushText').textContent = '止めたいときは、端末の設定の「通知」から変更できます。';
        yes.style.display = 'none'; no.textContent = '閉じる';
        refreshToken();
      } else {
        $('pushTitle').textContent = '通知を受け取りますか？';
        $('pushText').innerHTML = '塾からのお知らせや、成績の登録、特別講習の申込の受付を通知でお知らせします。';
      }
      document.body.classList.add('push-open');
    }
    function closePushSheet() { document.body.classList.remove('push-open'); }
    $('pushNo').addEventListener('click', closePushSheet);
    $('pushBack').addEventListener('click', closePushSheet);
    $('pushYes').addEventListener('click', () => {
      // 押した瞬間に許可を求める（iPhoneは、ボタンを押した直後でないと許可の画面が出ない）
      let req;
      try { req = Notification.requestPermission(); } catch (e) { req = Promise.resolve('default'); }
      Promise.resolve(req).then((perm) => {
        closePushSheet();
        toInner({ type: 'push-state', state: pushState() });
        if (perm !== 'granted') { toast('通知はオフのままです'); return; }
        return refreshToken().then((t) => toast(t ? '通知をオンにしました' : '通知の登録に失敗しました。もう一度お試しください'));
      });
    });
  </script>
</body>
</html>
